name: gen_medium_hyphy_busted
type: generate
difficulty: medium
description: "Single-tool but complex CLI, many params, HyPhy BUSTED method"
plan: plan.md
expected_files:
  - busted.xml
  - macros.xml
  - .shed.yml
assertions:
  - type: file_exists
    file: busted.xml
  - type: file_exists
    file: macros.xml
  - type: xml_element_exists
    file: busted.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: busted.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: xml_element_exists
    file: busted.xml
    xpath: ".//help[@format='markdown']"
  - type: xml_element_exists
    file: busted.xml
    xpath: ".//param[@type='data']"
  - type: file_contains
    file: macros.xml
    pattern: "@TOOL_VERSION@"
expect_validation_pass: true
expect_planemo_pass: true
