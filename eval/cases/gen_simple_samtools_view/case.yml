name: gen_simple_samtools_view
type: generate
difficulty: easy
description: "Single-tool wrapper for samtools view — well-known tool, straightforward"
plan: plan.md
expected_files:
  - samtools_view.xml
  - macros.xml
  - .shed.yml
assertions:
  - type: file_exists
    file: samtools_view.xml
  - type: file_exists
    file: macros.xml
  - type: xml_element_exists
    file: samtools_view.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: samtools_view.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: xml_element_exists
    file: samtools_view.xml
    xpath: ".//help[@format='markdown']"
  - type: file_contains
    file: macros.xml
    pattern: "@TOOL_VERSION@"
expect_validation_pass: true
expect_planemo_pass: true
