name: fb_fix_undefined_macro
type: feedback
difficulty: easy
description: "Missing macro definition — reviewer flags undefined 'requirements' macro"
existing_files:
  - my_tool.xml
  - macros.xml
feedback:
  review_comments:
    - author: alice
      file_path: my_tool.xml
      line: 5
      body: "The macro 'requirements' is referenced here but not defined in macros.xml. Please add the definition."
  pr_comments: []
  failed_checks:
    - name: planemo-lint
      conclusion: failure
      output: "Linting tool my_tool.xml\n.. ERROR: Macro 'requirements' is not defined"
  ci_artifacts: {}
assertions:
  - type: xml_element_exists
    file: macros.xml
    xpath: ".//xml[@name='requirements']"
expect_validation_pass: true
expect_planemo_pass: true
