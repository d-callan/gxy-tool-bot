name: gen_simple_seqtk
type: generate
difficulty: easy
description: "Single-tool wrapper for seqtk seq — simple CLI, one input one output"
plan: plan.md
expected_files:
  - seqtk_seq.xml
  - macros.xml
  - .shed.yml
assertions:
  - type: file_exists
    file: seqtk_seq.xml
  - type: file_exists
    file: macros.xml
  - type: xml_element_exists
    file: seqtk_seq.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: seqtk_seq.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: xml_element_exists
    file: seqtk_seq.xml
    xpath: ".//help[@format='markdown']"
  - type: file_contains
    file: macros.xml
    pattern: "@TOOL_VERSION@"
expect_validation_pass: true
expect_planemo_pass: true
