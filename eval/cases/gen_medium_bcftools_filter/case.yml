name: gen_medium_bcftools_filter
type: generate
difficulty: medium
description: "Single-tool with conditional params, multiple outputs, output format selection"
plan: plan.md
expected_files:
  - bcftools_filter.xml
  - macros.xml
  - .shed.yml
assertions:
  - type: file_exists
    file: bcftools_filter.xml
  - type: file_exists
    file: macros.xml
  - type: xml_element_exists
    file: bcftools_filter.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: bcftools_filter.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: xml_element_exists
    file: bcftools_filter.xml
    xpath: ".//help[@format='markdown']"
  - type: xml_element_exists
    file: bcftools_filter.xml
    xpath: ".//param[@type='select']"
  - type: file_contains
    file: macros.xml
    pattern: "@TOOL_VERSION@"
expect_validation_pass: true
expect_planemo_pass: true
