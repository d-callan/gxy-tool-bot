name: gen_hard_bcftools_family
type: generate
difficulty: hard
description: "Tool family (4+ XMLs), complex macros, test data for VCF/BCF"
plan: plan.md
expected_files:
  - bcftools_view.xml
  - bcftools_filter.xml
  - bcftools_sort.xml
  - bcftools_norm.xml
  - macros.xml
  - .shed.yml
assertions:
  - type: file_exists
    file: bcftools_view.xml
  - type: file_exists
    file: bcftools_filter.xml
  - type: file_exists
    file: bcftools_sort.xml
  - type: file_exists
    file: bcftools_norm.xml
  - type: file_exists
    file: macros.xml
  - type: xml_element_exists
    file: bcftools_view.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: bcftools_filter.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: bcftools_sort.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: bcftools_norm.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: bcftools_view.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: xml_element_exists
    file: bcftools_filter.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: xml_element_exists
    file: bcftools_sort.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: xml_element_exists
    file: bcftools_norm.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: file_contains
    file: macros.xml
    pattern: "@TOOL_VERSION@"
expect_validation_pass: true
expect_planemo_pass: true
