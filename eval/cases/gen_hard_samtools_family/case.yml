name: gen_hard_samtools_family
type: generate
difficulty: hard
description: "Tool family (3 XMLs), shared macros, different IO per subcommand"
plan: plan.md
expected_files:
  - samtools_view.xml
  - samtools_sort.xml
  - samtools_index.xml
  - macros.xml
  - .shed.yml
assertions:
  - type: file_exists
    file: samtools_view.xml
  - type: file_exists
    file: samtools_sort.xml
  - type: file_exists
    file: samtools_index.xml
  - type: file_exists
    file: macros.xml
  - type: xml_element_exists
    file: samtools_view.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: samtools_sort.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: samtools_index.xml
    xpath: ".//command[@detect_errors='aggressive']"
  - type: xml_element_exists
    file: samtools_view.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: xml_element_exists
    file: samtools_sort.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: xml_element_exists
    file: samtools_index.xml
    xpath: ".//test[@expect_num_outputs]"
  - type: file_contains
    file: macros.xml
    pattern: "@TOOL_VERSION@"
expect_validation_pass: true
expect_planemo_pass: true
